services:
  - type: web
    name: quantro-api
    runtime: docker
    branch: main
    # Standard compute: 1 CPU / 2 GB; separate from a Pro workspace subscription.
    plan: 1c-2g
    numInstances: 1
    dockerfilePath: ./backend/Dockerfile.vercel
    dockerContext: ./backend
    # Served only after startup has connected to Tiger; no database query per probe.
    healthCheckPath: /openapi.json
    envVars:
      # Opt in privately after configuring existing Spectrum credentials.
      - key: PHOTON_ENABLED
        sync: false
      - key: SPECTRUM_PROJECT_ID
        sync: false
      - key: SPECTRUM_PROJECT_SECRET
        sync: false
      - key: PHOTON_DATA_DIR
        sync: false
      - key: APP_ENV
        value: production
      - key: PHOTON_WEBHOOK_SECRET
        sync: false
      - key: REPORT_STORE
        value: tiger
      - key: TRANSCRIPTION_PROVIDER
        value: groq
      - key: SEARCH_PROVIDER
        value: exa
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_LLM_MODEL
        value: openai/gpt-oss-120b
      - key: YOUTUBE_API_KEY
        sync: false
      - key: EXA_API_KEY
        sync: false
      - key: TIGERDATA_SSL_ROOT_CERT
        value: /etc/ssl/certs/ca-certificates.crt
      - key: REPORT_BASE_URL
        sync: false
      - key: TIGER_DATABASE_URL
        sync: false
      - key: TIGERDATA_DSN
        sync: false
      - key: TIGER_TABLE_PREFIX
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        sync: false
      - key: PHOTON_BRIDGE_TOKEN
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false
      - key: PHOTON_API_KEY
        sync: false
      - key: PHOTON_BASE_URL
        sync: false
      - key: PHOTON_SENDER_ID
        sync: false

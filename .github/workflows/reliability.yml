name: Reliability regression checks

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: reliability-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APP_ENV: test
      ENVIRONMENT: test
      TIGER_DATABASE_URL: sqlite:///./quantro-ci.sqlite
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install media tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg tesseract-ocr
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Check dependencies and startup imports
        run: |
          python -m pip check
          python -c "from backend.main import validate_contract_functions; from backend.services.shared.runtime import configure_media_tools; validate_contract_functions(); configure_media_tools(); print('boot imports and media tools ok')"
          python -m backend.services.shared.export_frontend_types --check
      - name: Run isolated offline backend tests
        run: env -u NETWORK python -m pytest tests/ -v

  node:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        directory: [backend/services/photon, frontend]
    defaults:
      run:
        working-directory: ${{ matrix.directory }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: ${{ matrix.directory }}/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run typecheck
      - name: Build frontend
        if: matrix.directory == 'frontend'
        run: npm run build
